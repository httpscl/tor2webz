[main]
transport = HTTP
listen_ipv4 = 127.0.0.1
listen_ipv6 = None
listen_port_http = 8080
basehost = gateway.test
# Replace both paths; create the runtime directories before starting.
datadir = /absolute/path/runtime
# Installed packages find their assets automatically. Source checkouts do too.
# sysdatadir = /absolute/path/checkout/data
processes = 1
sockshost = 127.0.0.1
socksport = 9050
max_request_body_bytes = 8388608
max_concurrent_requests = 16
request_timeout = 60
logreqs = False
debugmode = False
# Set the actual public source URL before public deployment.
# source_url = https://github.com/OWNER/tor2webz
